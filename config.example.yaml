# ─────────────────────────────────────────────────────────────────────────────
# TRAFSCAN – Solution A  |  config.yaml
# ─────────────────────────────────────────────────────────────────────────────
#
# IMPORTANT — DATABASE PLACEMENT:
#   The CDR Registry (cdr_registry, anomaly_log) must be in the SAME
#   PostgreSQL database as the Trafscan application (same host, same dbname).
#   Do NOT create a separate database.
#
# HOW TO USE:
#   1. Copy this file to /opt/trafscan/config.yaml
#   2. Fill in every section marked with  ← FILL IN
#   3. Run:  python alerting.py --config config.yaml --test
#      to verify email before the first real batch run.
# ─────────────────────────────────────────────────────────────────────────────


# -----------------------------------------------------------------------------
# Database connection (CDR Registry - PostgreSQL)
# Same host/dbname as the existing Trafscan PostgreSQL instance.
# -----------------------------------------------------------------------------
database:
  host:     localhost
  port:     5432
  dbname:   #fill this
  user:     #fill this
  password: #fill this
  pool_min: 2
  pool_max: 10

# -----------------------------------------------------------------------------
# File Watcher — watched directories
# One entry per operator × CDR type combination.
# The operator and cdr_type come from the folder path, never the filename.
# -----------------------------------------------------------------------------

# For testing
watcher:
  stable_checks:    2
  stable_interval:  2.0
  extra_delay:      5.0

  sources:
    - directory:  C:/cdr_test/atel/in
      operator:   atel
      cdr_type:   in
      extensions: [".gz", ".add.gz", ".add"]
    - directory:  C:/cdr_test/atel/msc
      operator:   atel
      cdr_type:   msc
      extensions: [".gz", ".dat.gz", ".dat", ""]


